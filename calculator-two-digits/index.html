<!DOCTYPE html>

<html>
<head>
    <title>Calculadora</title>
    
</head>
<body>

    <h1>Esto es una calculadora que te calculara la suma, resta, multiplicacion y division de dos numeros</h1>
    <p>Iniciemos</p>
    <label for="a">Primer numero: </label>
    <input type="text" id="a">

    <label for="b">segundo numero: </label>
    <input type="text" id="b">

    <button onclick="suma()"> Suma </button> 
    <button onclick="resta()"> resta </button>
    <button onclick="multiplicacion()"> multiplicacion </button>
    <button onclick="division()"> division </button>

    <script src="script.js"></script>
</body>

</html>
