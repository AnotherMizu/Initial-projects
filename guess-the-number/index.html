<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gues the number game</title>
</head>
<body>

    <div id="toHide">
        <h1>Guess the number game</h1>
        <label>Do you want to start?</label>
        <input type="submit" value="start" id="startBoton">
    </div>
    <div style="display:none" id="toShow">
        <h1>Guess the number game</h1>
        <label>Introduce un numero</label>
        <input type="text" inputmode="numeric" id="userGuess">   


    </div>
    <div id="hints"></div>
    <div style="display: none;" id="result">
        <p>aqui algunas pruebas</p>
        <p id="userHints"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
